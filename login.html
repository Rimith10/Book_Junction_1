<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookHive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

</head>
<body>
    <header>
        <h1>📚 BookHive</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="books.html">Books</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">🛒 Cart (0)</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-section"><p class="eyebrow">Welcome back</p><h2>Login to BookHive</h2><p>Sign in to continue your reading journey.</p>
            <form action="#" method="POST" class="login-form">
                <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Enter your password" minlength="6" required></div>
                <div class="form-group checkbox-group"><input type="checkbox" id="remember" name="remember"><label for="remember">Remember me</label></div>
                <button type="submit" class="btn">Login</button>
                <p class="form-link"><a href="#">Forgot password?</a></p><p class="form-link">Don't have an account? <a href="signup.html">Sign up here</a></p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 BookHive. All rights reserved.</p>
        <p><a href="about.html">About</a> | <a href="contact.html">Contact</a> | <a href="#">Privacy Policy</a></p>
    </footer>
</body>
</html>
